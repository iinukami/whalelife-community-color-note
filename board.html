<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>颜色便签</title>
  <style>
    :root { color:#263731; background:#fafbf9; font:16px/1.65 "Source Sans 3","Microsoft YaHei",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; padding:clamp(16px,4vw,48px); }
    main { max-width:760px; margin:auto; }
    h1 { font-size:clamp(24px,4vw,34px); line-height:1.25; margin:0 0 22px; }
    form, article { padding:clamp(20px,3vw,32px); border-radius:15px; }
    form { background:white; border:1px solid #d8e1da; }
    label[for],legend { font-weight:650; }
    textarea { display:block; width:100%; margin:7px 0 14px; padding:10px; border:1px solid #97a99e; border-radius:7px; resize:vertical; font:inherit; }
    fieldset { margin:0 0 18px; padding:0; border:0; }
    fieldset label { display:inline-flex; align-items:center; gap:5px; margin:5px 12px 0 0; }
    input { accent-color:#285a48; }
    button { font:inherit; color:white; background:#285a48; border:0; border-radius:6px; padding:7px 17px; cursor:pointer; }
    button:disabled { opacity:.55; }
    #status { margin-inline-start:10px; font-size:14px; }
    article { margin-top:18px; color:#273731; background:#dcf1e3; border-left:5px solid #81b494; }
    article[data-color=apricot] { background:#ffead7; border-color:#dba277; }
    article[data-color=lilac] { background:#ede5fb; border-color:#b09bc9; }
    article h2 { font-size:14px; font-weight:500; margin:0 0 6px; }
    article p { margin:0; font-size:19px; white-space:pre-wrap; overflow-wrap:anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>颜色便签</h1>
    <form id="note-form">
      <label for="note-text">便签内容</label>
      <textarea id="note-text" maxlength="180" rows="3" required></textarea>
      <fieldset>
        <legend>便签颜色</legend>
        <label><input name="color" type="radio" value="mint" checked>薄荷绿</label>
        <label><input name="color" type="radio" value="apricot">杏橙</label>
        <label><input name="color" type="radio" value="lilac">淡紫</label>
      </fieldset>
      <button id="save-note" type="submit" disabled>保存便签</button>
      <span id="status" role="status" aria-live="polite"></span>
    </form>
    <article id="saved-note" hidden><h2>已保存的便签</h2><p id="saved-text"></p></article>
  </main>
  <script src="./board.js" defer></script>
</body>
</html>
